name: guestbook

# Fires only when YOU add the `approved` label to an issue.
# Visitors can open issues; nothing reaches your profile until you approve it.
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

jobs:
  sign:
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record the entry
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python3 scripts/guestbook.py

      - name: Rebuild README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python3 scripts/build_profile.py

      - name: Commit
        run: |
          git config user.name  "profile-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/status.svg data/
          if git diff --staged --quiet; then
            echo "nothing to commit"
          else
            git commit -m "guestbook: entry from @${{ github.event.issue.user.login }}"
            git push
          fi

      - name: Reply and close
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --body "Signed — you're on the board. Thanks for stopping by."
          gh issue close ${{ github.event.issue.number }}
